<header class="site-banner">
  <div class="banner-container">
    <div class="banner-left">
      <a href="{{ site.baseurl }}/" class="logo-link">
        <img
          src="{{ '/assets/images/mwi_coat_of_arms.svg' | relative_url }}"
          alt="Malawi Coat of Arms" class="site-logo" width="70" height="72"
        >
      </a>
      <h1 class="site-title">
        <a href="{{ site.baseurl }}/">Malawi HIV Maps</a>
      </h1>
    </div>

    <div class="banner-right">
      <div class="districts-dropdown">
        <button class="dropdown-toggle" aria-expanded="false" onclick="this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'); this.nextElementSibling.setAttribute('aria-hidden', this.getAttribute('aria-expanded') === 'false' ? 'true' : 'false');">
          Districts
          <span class="dropdown-icon">▼</span>
        </button>
        <ul class="dropdown-menu" aria-hidden="true">
          {% for district_page in site.districts %}
          <li>
            <a href="./{{ district_page.title }}.html">{{ district_page.title }}</a>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</header>

<script>
  // Close dropdown when clicking outside
  document.addEventListener('click', function(event) {
    const dropdown = document.querySelector('.districts-dropdown');
    const toggle = dropdown.querySelector('.dropdown-toggle');
    const menu = dropdown.querySelector('.dropdown-menu');

    if (!dropdown.contains(event.target)) {
      toggle.setAttribute('aria-expanded', 'false');
      menu.setAttribute('aria-hidden', 'true');
    }
  });
</script>
